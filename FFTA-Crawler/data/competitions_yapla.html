
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<link crossorigin="" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />

<div class="filtres-competitions-wrapper">

<div class="filtres-wrapper">
<div class="filtres-container">

<div class="filtre filtre-select">
<select id="discipline">
<option value="">Toutes</option>
<option value="TAE">TAE</option>
<option value="Campagne">Campagne</option>
<option value="3D">3D</option>
<option value="Nature">Nature</option>
<option value="Beursault">Beursault</option>
<option value="18m">18m</option>
<option value="Loisir">Loisir</option>
</select>
</div>

<div class="filtre distance-filtre">

<label>
Distance max :
<span id="distanceValue">Indre-et-Loire</span>
</label>

<input
id="distanceRange"
max="36"
min="0"
step="1"
type="range"
value="0"
/>

</div>

<div class="filtre date-filtre">

<label for="dateDebut">
Du :
</label>

<input
id="dateDebut"
type="date"
/>

</div>

<div class="filtre date-filtre">

<label for="dateFin">
Au :
</label>

<input
id="dateFin"
type="date"
/>

</div>

<div class="filtre reset-filtre">

<button
id="resetDates"
type="button"
>
Réinitialiser
</button>

</div>

</div>
</div>

<div id="map" style="height:500px; width:100%; margin:30px auto;">
&nbsp;
</div>

<div class="competitions-wrapper">
<div class="competitions-grid">
&nbsp;
</div>
</div>

</div>

<style type="text/css">

  width:100%;
  display:flex;
  justify-content:center;
  margin:20px 0;
  font-family:'Roboto',sans-serif;
}

  display:flex;
  gap:20px;
  align-items:end;
  flex-wrap:wrap;
  justify-content:center;

  display:flex;
  flex-direction:column;

  padding:0 12px;
  font-size:18px;
  width:220px;
  height:46px;
  border:2px solid #333870;
  border-radius:6px;
  color:#333870;
  background-color:white;
  cursor:pointer;
  appearance:none;
  background-image:url('data:image/svg+xml;utf8,<svg fill="%230063FF" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
  background-repeat:no-repeat;
  background-position:right 12px center;
  background-size:18px;

  display:none;

  color:#F5B61D;
}

}

  color:#FF0000;

</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<script>

document.addEventListener("DOMContentLoaded", function(){

  fetch("https://ballawgd.github.io/FFTA-Competitions/competitions.json")

    .then(response => {

      if(!response.ok) {

        throw new Error(
          "Erreur HTTP " + response.status
        );

      }

      return response.json();

    })

    .then(competitions => {


      // ==========================================
      // CONVERSION DES DATES
      // ==========================================

      function convertirDate(dateString) {

        if(!dateString) {
          return null;
        }

        const morceaux =
          dateString.split("-");

        if(morceaux.length !== 3) {
          return null;
        }

        const annee =
          Number(morceaux[0]);

        const mois =
          Number(morceaux[1]) - 1;

        const jour =
          Number(morceaux[2]);

        if(
          !Number.isInteger(annee) ||
          !Number.isInteger(mois) ||
          !Number.isInteger(jour)
        ) {

          return null;

        }

        const resultat =
          new Date(
            annee,
            mois,
            jour
          );

        if(
          isNaN(resultat.getTime())
        ) {

          return null;

        }

        return resultat;

      }


      // ==========================================
      // DATE DU JOUR
      // ==========================================

      const aujourdHui =
        new Date();

      aujourdHui.setHours(
        0,
        0,
        0,
        0
      );


      // ==========================================
      // SUPPRESSION DES COMPÉTITIONS TERMINÉES
      // ==========================================

      competitions =
        competitions.filter(
          comp => {

            const dateFin =
              convertirDate(
                comp.date_fin
              );

            if(!dateFin) {

              return true;

            }

            return dateFin >= aujourdHui;

          }
        );


      // ==========================================
      // TRI CHRONOLOGIQUE
      // ==========================================

      competitions.sort(
        (a,b) => {

          const dateA =
            convertirDate(
              a.date_debut
            );

          const dateB =
            convertirDate(
              b.date_debut
            );

          if(!dateA && !dateB) {

            return 0;

          }

          if(!dateA) {

            return 1;

          }

          if(!dateB) {

            return -1;

          }

          return dateA - dateB;

        }
      );


      // ==========================================
      // GESTION DES POSITIONS IDENTIQUES
      // ==========================================

      const locationCounts = {};

      competitions.forEach(comp => {

        const key =
          comp.lat + "," + comp.lng;

        if(!locationCounts[key]) {

          locationCounts[key] = 0;

        } else {

          const offset =
            0.0025 *
            locationCounts[key];

          const angle =
            locationCounts[key] *
            45 *
            Math.PI /
            180;

          comp.lat +=
            Math.sin(angle) *
            offset;

          comp.lng +=
            Math.cos(angle) *
            offset;

        }

        locationCounts[key]++;

      });


      // ==========================================
      // CARTE
      // ==========================================

      const map =
        L.map('map').setView(
          [46.5, 2],
          6
        );


      L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
          attribution:
            '&copy; OpenStreetMap contributors',
          maxZoom:18
        }
      ).addTo(map);


      // ==========================================
      // COULEURS DES DISCIPLINES
      // ==========================================

      const typeColors = {

        "TAE":"blue",
        "Campagne":"orange",
        "3D":"green",
        "Nature":"red",
        "Beursault":"black",
        "18m":"brown",
        "Loisir":"purple"

      };


      // ==========================================
      // MARQUEURS
      // ==========================================

      const markers = [];


      competitions.forEach(
        (comp,index)=>{

          const marker =
            L.circleMarker(
              [comp.lat,comp.lng],
              {

                radius:8,

                fillColor:
                  typeColors[comp.type] ||
                  "gray",

                color:"#fff",

                weight:1,

                opacity:1,

                fillOpacity:0.9

              }
            ).addTo(map);


          marker.bindPopup(`

            <div style="text-align:center; font-family:Roboto,sans-serif;">

              <strong style="color:#333870;">
                ${comp.nom}
              </strong>

              <br>

              <span>
                ${comp.type} - ${comp.dates}
              </span>

              <br>

              <a
                href="${comp.lien}"
                target="_blank"
                rel="noopener noreferrer"
                class="ffta-button"
              >
                Fiche FFTA
              </a>

            </div>

          `);


          marker.competitionIndex =
            index;


          marker.on(
            "mouseover",
            () => {

              marker.openPopup();

              const color =
                marker.options.fillColor ||
                "gray";

              const popupEl =
                marker.getPopup().getElement();


              if(popupEl){

                popupEl.style.border =
                  `3px solid ${color}`;

                popupEl.style.borderRadius =
                  "15px";


                const content =
                  popupEl.querySelector(
                    ".leaflet-popup-content"
                  );


                if(content){

                  content.style.fontFamily =
                    "Roboto, sans-serif";

                  content.style.fontSize =
                    "12px";

                  content.style.fontWeight =
                    "500";

                  content.style.color =
                    "#333870";

                }

              }

            }
          );


          marker.on(
            "mouseout",
            () => {

              marker.closePopup();

            }
          );


          marker.on(
            "click",
            () => {

              const card =
                document.querySelectorAll(
                  ".competition-card"
                )[marker.competitionIndex];


              if(card) {

                card.scrollIntoView({
                  behavior:"smooth"
                });

              }

            }
          );


          markers.push(
            marker
          );

        }
      );


      // ==========================================
      // CRÉATION DES CARTES
      // ==========================================

      const grid =
        document.querySelector(
          ".competitions-grid"
        );


      competitions.forEach(
        comp=>{

          const card =
            document.createElement(
              "div"
            );


          card.className =
            `competition-card type-${comp.type}`;


          card.dataset.discipline =
            comp.type;


          card.dataset.distance =
            comp.distance;


          card.dataset.codePostal =
            comp.code_postal || "";


          card.dataset.dateDebut =
            comp.date_debut;


          card.dataset.dateFin =
            comp.date_fin;


          let displayType =
            comp.type;


          if(
            comp.type === "Beursault"
          ) {

            displayType =
              "B";

          } else if(
            comp.type === "Campagne"
          ) {

            displayType =
              "C";

          } else if(
            comp.type === "18m"
          ) {

            displayType =
              "18m";

          } else if(
            comp.type === "Loisir"
          ) {

            displayType =
              "Loisir";

          }


          card.innerHTML = `

            <h3 class="competition-title">
              ${comp.nom}
            </h3>

            <span class="type type-${comp.type}">
              ${displayType}
            </span>

            <div class="distance">
              ${comp.distance} km
            </div>

            <div class="dates">
              ${comp.dates}
            </div>

            <a
              href="${comp.lien}"
              target="_blank"
              rel="noopener noreferrer"
              class="ffta-button"
            >
              Voir la fiche FFTA
            </a>

          `;


          grid.appendChild(
            card
          );

        }
      );


      // ==========================================
      // FILTRES
      // ==========================================

      const selectDiscipline =
        document.getElementById(
          "discipline"
        );


      const range =
        document.getElementById(
          "distanceRange"
        );


      const value =
        document.getElementById(
          "distanceValue"
        );


      const dateDebutInput =
        document.getElementById(
          "dateDebut"
        );


      const dateFinInput =
        document.getElementById(
          "dateFin"
        );


      const resetDates =
        document.getElementById(
          "resetDates"
        );


      const cards =
        document.querySelectorAll(
          ".competition-card"
        );


      // ==========================================
      // FILTRAGE
      // ==========================================

      function filterCards() {

        const discipline =
          selectDiscipline.value;


        // ======================================
        // FILTRE DISTANCE
        //
        // 0  = Indre-et-Loire
        //      uniquement les codes 37xxx
        //
        // 1  = 60 km
        // 2  = 70 km
        // ...
        // 35 = 400 km
        // 36 = France = 1500 km
        // ======================================

        const sliderValue =
          parseInt(
            range.value
          );


        let maxDistance = 60;

        let indreEtLoire = false;


        if(sliderValue === 0) {

          indreEtLoire = true;

          maxDistance = 60;

        } else if(sliderValue === 36) {

          maxDistance = 1500;

        } else {

          maxDistance =
            50 + (sliderValue * 10);

        }


        const dateDebutRecherche =
          dateDebutInput.value
            ? convertirDate(
                dateDebutInput.value
              )
            : null;


        const dateFinRecherche =
          dateFinInput.value
            ? convertirDate(
                dateFinInput.value
              )
            : null;


        const bounds =
          L.latLngBounds();


        cards.forEach(
          (card,i)=>{

            const cardDiscipline =
              card.dataset.discipline;


            const cardDistance =
              parseFloat(
                card.dataset.distance
              );


            const cardCodePostal =
              card.dataset.codePostal ||
              "";


            const dateDebut =
              convertirDate(
                card.dataset.dateDebut
              );


            const dateFin =
              convertirDate(
                card.dataset.dateFin
              );


            // ==================================
            // FILTRE DATE
            // ==================================

            let competitionActive =
              true;


            if(dateFin){

              competitionActive =
                dateFin >= aujourdHui;

            }


            let correspondDate =
              true;


            if(
              dateDebutRecherche &&
              dateFinRecherche
            ){

              correspondDate =
                dateDebut &&
                dateFin &&
                dateDebut <= dateFinRecherche &&
                dateFin >= dateDebutRecherche;

            } else if(
              dateDebutRecherche
            ){

              correspondDate =
                dateFin &&
                dateFin >= dateDebutRecherche;

            } else if(
              dateFinRecherche
            ){

              correspondDate =
                dateDebut &&
                dateDebut <= dateFinRecherche;

            }


            // ==================================
            // FILTRE INDRE-ET-LOIRE
            // ==================================

            let correspondDistance =
              true;


            if(indreEtLoire){

              correspondDistance =
                /^37\d{3}$/.test(
                  cardCodePostal
                );

            } else {

              correspondDistance =
                cardDistance <= maxDistance;

            }


            // ==================================
            // FILTRE GLOBAL
            // ==================================

            const show =
              competitionActive
              &&
              correspondDate
              &&
              (
                discipline === ""
                ||
                discipline === cardDiscipline
              )
              &&
              correspondDistance;


            card.style.display =
              show
                ? "block"
                : "none";


            if(show){

              if(
                !map.hasLayer(
                  markers[i]
                )
              ){

                markers[i].addTo(
                  map
                );

              }


              bounds.extend(
                markers[i].getLatLng()
              );


            } else {

              if(
                map.hasLayer(
                  markers[i]
                )
              ){

                map.removeLayer(
                  markers[i]
                );

              }

            }

          }
        );


        if(bounds.isValid()){

          map.fitBounds(
            bounds,
            {
              padding:[
                50,
                50
              ]
            }
          );

        }

      }


      // ==========================================
      // SLIDER DISTANCE
      // ==========================================

      range.addEventListener(
        "input",
        ()=>{

          const sliderValue =
            parseInt(
              range.value
            );


          if(sliderValue === 0){

            value.textContent =
              "Indre-et-Loire";

          } else if(sliderValue === 36){

            value.textContent =
              "France";

          } else {

            value.textContent =
              (50 + sliderValue * 10) +
              " km";

          }


          filterCards();

        }
      );


      // ==========================================
      // FILTRE DISCIPLINE
      // ==========================================

      selectDiscipline.addEventListener(
        "change",
        filterCards
      );


      // ==========================================
      // FILTRE DATE DEBUT
      // ==========================================

      dateDebutInput.addEventListener(
        "change",
        ()=>{

          filterCards();

        }
      );


      // ==========================================
      // FILTRE DATE FIN
      // ==========================================

      dateFinInput.addEventListener(
        "change",
        ()=>{

          filterCards();

        }
      );


      // ==========================================
      // RÉINITIALISATION
      // ==========================================

      resetDates.addEventListener(
        "click",
        ()=>{

          dateDebutInput.value = "";
          dateFinInput.value = "";

          range.value = 0;

          value.textContent =
            "Indre-et-Loire";

          filterCards();

        }
      );


      // ==========================================
      // FILTRAGE INITIAL
      // ==========================================

      filterCards();

    })


    // ==========================================
    // ERREUR DE CHARGEMENT
    // ==========================================

    .catch(
      error => {

        console.error(
          "Erreur lors du chargement des compétitions :",
          error
        );


        document.querySelector(
          ".competitions-grid"
        ).innerHTML =
          "<p>Impossible de charger les compétitions.</p>";

      }
    );

});

</script>
