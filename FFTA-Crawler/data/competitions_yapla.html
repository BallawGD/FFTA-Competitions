{ nom: "SAINT ANDRÉ", dates: "7 mars", type: "TAE", distance: 9370.2, lat: -20.9568, lng: 55.6374, lien: "https://www.ffta.fr/epreuve/27782" },
{ nom: "SAINT ANDRÉ", dates: "2 mai", type: "TAE", distance: 9370.2, lat: -20.9568, lng: 55.6374, lien: "https://www.ffta.fr/epreuve/27783" },
{ nom: "SAINT-PIERRE", dates: "23 mai", type: "TAE", distance: 9395.1, lat: -21.309, lng: 55.5044, lien: "https://www.ffta.fr/epreuve/27784" }
  ];


  // ==================== DECALAGE DES POINTS IDENTIQUES ====================

  const locationCounts = {};

  competitions.forEach(comp => {

    const key = comp.lat + "," + comp.lng;

    if(!locationCounts[key]) {

      locationCounts[key] = 0;

    } else {

      const offset = 0.0025 * locationCounts[key];

      const angle =
        locationCounts[key] * 45 * Math.PI / 180;

      comp.lat += Math.sin(angle) * offset;
      comp.lng += Math.cos(angle) * offset;

    }

    locationCounts[key]++;

  });


  // ==================== CARTE ====================

  const map = L.map('map').setView([46.5, 2],6);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution:'&copy; OpenStreetMap contributors',
      maxZoom:18
    }
  ).addTo(map);


  // ==================== COULEURS ====================

  const typeColors = {

    "TAE":"blue",
    "Campagne":"orange",
    "3D":"green",
    "Nature":"red",
    "Beursault":"black",
    "18m":"brown",
    "Loisir":"purple"

  };


  const markers = [];


  // ==================== MARKERS ====================

  competitions.forEach((comp,index)=>{

    const marker = L.circleMarker(
      [comp.lat,comp.lng],
      {

        radius:8,

        fillColor:
          typeColors[comp.type] || "gray",

        color:"#fff",

        weight:1,

        opacity:1,

        fillOpacity:0.9

      }
    ).addTo(map);


    // ==================== POPUP ====================

    marker.bindPopup(`

      <div style="text-align:center; font-family:Roboto,sans-serif;">

        <strong style="color:#333870;">
          ${comp.nom}
        </strong>

        <br>

        <span>
          ${comp.type} - ${comp.dates}
        </span>

        <br>

        <a
          href="${comp.lien}"
          target="_blank"
          rel="noopener noreferrer"
          class="ffta-button"
        >
          Fiche FFTA
        </a>

      </div>

    `);


    marker.competitionIndex = index;


    // ==================== SURVOL ====================

    marker.on("mouseover", () => {

      marker.openPopup();

      const color =
        marker.options.fillColor || "gray";

      const popupEl =
        marker.getPopup().getElement();

      if(popupEl){

        popupEl.style.border =
          `3px solid ${color}`;

        popupEl.style.borderRadius =
          "15px";


        const content =
          popupEl.querySelector(
            ".leaflet-popup-content"
          );

        if(content){

          content.style.fontFamily =
            "Roboto, sans-serif";

          content.style.fontSize =
            "12px";

          content.style.fontWeight =
            "500";

          content.style.color =
            "#333870";

        }

      }

    });


    // ==================== SORTIE DU POINT ====================

    marker.on("mouseout", () => {

      marker.closePopup();

    });


    // ==================== CLIC SUR LE POINT ====================

    marker.on("click", () => {

      const card =
        document.querySelectorAll(
          ".competition-card"
        )[marker.competitionIndex];

      if(card) {

        card.scrollIntoView({
          behavior:"smooth"
        });

      }

    });


    markers.push(marker);

  });


  // ==================== GENERATION DES CARDS ====================

  const grid =
    document.querySelector(
      ".competitions-grid"
    );


  competitions.forEach(comp=>{

    const card =
      document.createElement("div");


    card.className =
      `competition-card type-${comp.type}`;


    card.dataset.discipline =
      comp.type;


    card.dataset.distance =
      comp.distance;


    let displayType = comp.type;


    if(comp.type==="Beursault") {

      displayType = "B";

    } else if(comp.type==="Campagne") {

      displayType = "C";

    } else if(comp.type==="18m") {

      displayType = "18m";

    } else if(comp.type==="Loisir") {

      displayType = "Loisir";

    }


    card.innerHTML = `

      <h3 class="competition-title">
        ${comp.nom}
      </h3>

      <span class="type type-${comp.type}">
        ${displayType}
      </span>

      <div class="distance">
        ${comp.distance} km
      </div>

      <div class="dates">
        ${comp.dates}
      </div>

      <a
        href="${comp.lien}"
        target="_blank"
        rel="noopener noreferrer"
        class="ffta-button"
      >
        Voir la fiche FFTA
      </a>

    `;


    grid.appendChild(card);

  });


  // ==================== FILTRAGE ====================

  const selectDiscipline =
    document.getElementById(
      "discipline"
    );

  const range =
    document.getElementById(
      "distanceRange"
    );

  const value =
    document.getElementById(
      "distanceValue"
    );

  const cards =
    document.querySelectorAll(
      ".competition-card"
    );


  function filterCards() {

    const discipline =
      selectDiscipline.value;

    const maxDistance =
      parseInt(range.value);


    const bounds =
      L.latLngBounds();


    cards.forEach((card,i)=>{

      const cardDiscipline =
        card.dataset.discipline;

      const cardDistance =
        parseInt(card.dataset.distance);


      const show =
        (
          discipline === "" ||
          discipline === cardDiscipline
        )
        &&
        cardDistance <= maxDistance;


      card.style.display =
        show ? "block" : "none";


      if(show){

        if(!map.hasLayer(markers[i])){

          markers[i].addTo(map);

        }


        bounds.extend(
          markers[i].getLatLng()
        );


      } else {

        if(map.hasLayer(markers[i])){

          map.removeLayer(markers[i]);

        }

      }

    });


    if(bounds.isValid()){

      map.fitBounds(
        bounds,
        {
          padding:[50,50]
        }
      );

    }

  }


  range.addEventListener(
    "input",
    ()=>{

      value.textContent =
        range.value;

      filterCards();

    }
  );


  selectDiscipline.addEventListener(
    "change",
    filterCards
  );


  filterCards();

});

</script>
