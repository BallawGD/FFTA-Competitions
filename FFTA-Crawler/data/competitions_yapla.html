<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<link crossorigin="" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />

<div class="filtres-competitions-wrapper">

<!-- FILTRES -->

<div class="filtres-wrapper">
<div class="filtres-container">

<div class="filtre filtre-select">
<select id="discipline">
<option value="">Toutes</option>
<option value="TAE">TAE</option>
<option value="Campagne">Campagne</option>
<option value="3D">3D</option>
<option value="Nature">Nature</option>
<option value="Beursault">Beursault</option>
<option value="18m">18m</option>
<option value="Loisir">Loisir</option>
</select>
</div>

<div class="filtre distance-filtre">
<label>
Distance max :
<span id="distanceValue">250</span> km
</label>

<input id="distanceRange" max="250" min="0" type="range" value="250" />
</div>

</div>
</div>


<!-- CARTE -->

<div id="map" style="height:500px; width:100%; margin:30px auto;">
&nbsp;
</div>


<!-- LISTE DES COMPETITIONS -->

<div class="competitions-wrapper">
<div class="competitions-grid">
&nbsp;
</div>
</div>

</div>


<style type="text/css">

/* ==================== FILTRES ==================== */

.filtres-wrapper {
  width:100%;
  display:flex;
  justify-content:center;
  margin:20px 0;
  font-family:'Roboto',sans-serif;
}

.filtres-container {
  display:flex;
  gap:30px;
  align-items:center;
}

.filtre {
  display:flex;
  flex-direction:column;
}

.filtre-select select {
  padding:0 12px;
  font-size:18px;
  width:220px;
  height:46px;
  border:2px solid #333870;
  border-radius:6px;
  color:#333870;
  background-color:white;
  cursor:pointer;
  appearance:none;
  background-image:url('data:image/svg+xml;utf8,<svg fill="%230063FF" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
  background-repeat:no-repeat;
  background-position:right 12px center;
  background-size:18px;
}

.filtre-select select::-ms-expand {
  display:none;
}

.distance-filtre input {
  width:260px;
  margin-top:0px;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#333870;
  cursor:pointer;
}

.distance-filtre label {
  color:#333870;
  font-weight:bold;
}


/* ==================== COMPETITIONS ==================== */

.competitions-wrapper {
  width:100%;
  display:flex;
  justify-content:center;
  margin-top:30px;
  font-family:'Roboto',sans-serif;
}

.competitions-grid {
  max-width:1100px;
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
  font-size:0;
}

.competition-card {
  border:5px solid #333870;
  border-radius:8px;
  padding:20px;
  text-align:center;
  font-family:'Roboto',sans-serif;
  position:relative;
  font-size:16px;
}

.competition-title {
  margin:0;
  color:#333870;
}

.type {
  position:absolute;
  top:20px;
  right:20px;
  font-weight:bold;
}

.distance,
.dates {
  margin-top:3px;
  color:#333870;
}


/* ==================== BOUTON FFTA ==================== */

.ffta-button {
  display:inline-block;
  margin-top:14px;
  padding:8px 14px;
  background:#333870;
  color:white !important;
  text-decoration:none !important;
  border-radius:5px;
  font-size:13px;
  font-weight:700;
  transition:opacity 0.2s ease;
}

.ffta-button:hover {
  opacity:0.8;
}


/* ==================== COULEURS ==================== */

.competition-card.type-TAE {
  border-color:#333870;
}

.competition-card.type-Campagne {
  border-color:#F5B61D;
}

.competition-card.type-3D {
  border-color:#006400;
}

.competition-card.type-Nature {
  border-color:#FF0000;
}

.competition-card.type-Beursault {
  border-color:#000000;
}

.competition-card.type-18m {
  border-color:#8B4513;
}

.competition-card.type-Loisir {
  border-color:#800080;
}


.type.type-TAE {
  color:#333870;
}

.type.type-Campagne {
  color:#F5B61D;
}

.type.type-3D {
  color:#006400;
}

.type.type-Nature {
  color:#FF0000;
}

.type.type-Beursault {
  color:#000000;
}

.type.type-18m {
  color:#8B4513;
}

.type.type-Loisir {
  color:#800080;
}


/* ==================== RESPONSIVE MOBILE ==================== */

@media (max-width:768px) {

  .filtres-container {
    flex-direction:column;
    gap:20px;
    align-items:center;
  }

  .competitions-grid {
    grid-template-columns:1fr;
    font-size:0;
  }

  .competition-card {
    font-size:16px;
  }

}

</style>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<script>

document.addEventListener("DOMContentLoaded", function() {

  // ==================== CHARGEMENT DES DONNÉES ====================

  fetch("https://ballawgd.github.io/FFTA-Competitions/competitions.json")
    .then(response => {

      if(!response.ok) {
        throw new Error(
          "Erreur HTTP " + response.status
        );
      }

      return response.json();

    })
    .then(competitions => {

      // ==================== DECALAGE DES POINTS IDENTIQUES ====================

      const locationCounts = {};

      competitions.forEach(comp => {

        const key = comp.lat + "," + comp.lng;

        if(!locationCounts[key]) {

          locationCounts[key] = 0;

        } else {

          const offset =
            0.0025 * locationCounts[key];

          const angle =
            locationCounts[key] *
            45 *
            Math.PI /
            180;

          comp.lat +=
            Math.sin(angle) *
            offset;

          comp.lng +=
            Math.cos(angle) *
            offset;

        }

        locationCounts[key]++;

      });


      // ==================== CARTE ====================

      const map =
        L.map('map').setView(
          [46.5, 2],
          6
        );


      L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
          attribution:
            '&copy; OpenStreetMap contributors',
          maxZoom:18
        }
      ).addTo(map);


      // ==================== COULEURS ====================

      const typeColors = {

        "TAE":"blue",
        "Campagne":"orange",
        "3D":"green",
        "Nature":"red",
        "Beursault":"black",
        "18m":"brown",
        "Loisir":"purple"

      };


      const markers = [];


      // ==================== MARKERS ====================

      competitions.forEach((comp,index)=>{

        const marker =
          L.circleMarker(
            [comp.lat,comp.lng],
            {

              radius:8,

              fillColor:
                typeColors[comp.type] ||
                "gray",

              color:"#fff",

              weight:1,

              opacity:1,

              fillOpacity:0.9

            }
          ).addTo(map);


        // ==================== POPUP ====================

        marker.bindPopup(`

          <div style="text-align:center; font-family:Roboto,sans-serif;">

            <strong style="color:#333870;">
              ${comp.nom}
            </strong>

            <br>

            <span>
              ${comp.type} - ${comp.dates}
            </span>

            <br>

            <a
              href="${comp.lien}"
              target="_blank"
              rel="noopener noreferrer"
              class="ffta-button"
            >
              Fiche FFTA
            </a>

          </div>

        `);


        marker.competitionIndex = index;


        // ==================== SURVOL ====================

        marker.on("mouseover", () => {

          marker.openPopup();

          const color =
            marker.options.fillColor ||
            "gray";

          const popupEl =
            marker.getPopup().getElement();

          if(popupEl){

            popupEl.style.border =
              `3px solid ${color}`;

            popupEl.style.borderRadius =
              "15px";


            const content =
              popupEl.querySelector(
                ".leaflet-popup-content"
              );

            if(content){

              content.style.fontFamily =
                "Roboto, sans-serif";

              content.style.fontSize =
                "12px";

              content.style.fontWeight =
                "500";

              content.style.color =
                "#333870";

            }

          }

        });


        // ==================== SORTIE DU POINT ====================

        marker.on("mouseout", () => {

          marker.closePopup();

        });


        // ==================== CLIC SUR LE POINT ====================

        marker.on("click", () => {

          const card =
            document.querySelectorAll(
              ".competition-card"
            )[marker.competitionIndex];

          if(card) {

            card.scrollIntoView({
              behavior:"smooth"
            });

          }

        });


        markers.push(marker);

      });


      // ==================== GENERATION DES CARDS ====================

      const grid =
        document.querySelector(
          ".competitions-grid"
        );


      competitions.forEach(comp=>{

        const card =
          document.createElement("div");


        card.className =
          `competition-card type-${comp.type}`;


        card.dataset.discipline =
          comp.type;


        card.dataset.distance =
          comp.distance;


        let displayType =
          comp.type;


        if(comp.type==="Beursault") {

          displayType = "B";

        } else if(comp.type==="Campagne") {

          displayType = "C";

        } else if(comp.type==="18m") {

          displayType = "18m";

        } else if(comp.type==="Loisir") {

          displayType = "Loisir";

        }


        card.innerHTML = `

          <h3 class="competition-title">
            ${comp.nom}
          </h3>

          <span class="type type-${comp.type}">
            ${displayType}
          </span>

          <div class="distance">
            ${comp.distance} km
          </div>

          <div class="dates">
            ${comp.dates}
          </div>

          <a
            href="${comp.lien}"
            target="_blank"
            rel="noopener noreferrer"
            class="ffta-button"
          >
            Voir la fiche FFTA
          </a>

        `;


        grid.appendChild(card);

      });


      // ==================== FILTRAGE ====================

      const selectDiscipline =
        document.getElementById(
          "discipline"
        );


      const range =
        document.getElementById(
          "distanceRange"
        );


      const value =
        document.getElementById(
          "distanceValue"
        );


      const cards =
        document.querySelectorAll(
          ".competition-card"
        );


      function filterCards() {

        const discipline =
          selectDiscipline.value;


        const maxDistance =
          parseInt(range.value);


        const bounds =
          L.latLngBounds();


        cards.forEach((card,i)=>{

          const cardDiscipline =
            card.dataset.discipline;


          const cardDistance =
            parseFloat(
              card.dataset.distance
            );


          const show =
            (
              discipline === "" ||
              discipline === cardDiscipline
            )
            &&
            cardDistance <= maxDistance;


          card.style.display =
            show ? "block" : "none";


          if(show){

            if(!map.hasLayer(markers[i])){

              markers[i].addTo(map);

            }


            bounds.extend(
              markers[i].getLatLng()
            );


          } else {

            if(map.hasLayer(markers[i])){

              map.removeLayer(
                markers[i]
              );

            }

          }

        });


        if(bounds.isValid()){

          map.fitBounds(
            bounds,
            {
              padding:[50,50]
            }
          );

        }

      }


      range.addEventListener(
        "input",
        ()=>{

          value.textContent =
            range.value;

          filterCards();

        }
      );


      selectDiscipline.addEventListener(
        "change",
        filterCards
      );


      filterCards();

    })
    .catch(error => {

      console.error(
        "Erreur lors du chargement des compétitions :",
        error
      );

      document.querySelector(
        ".competitions-grid"
      ).innerHTML =
        "<p>Impossible de charger les compétitions.</p>";

    });

});

</script>
